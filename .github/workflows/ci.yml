name: firmware-ci

on:
  push:
    branches: [ main, develop, 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build firmware (ARM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Build
        run: make FW_VERSION=${GITHUB_REF_NAME}

      - name: Upload firmware artefact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            build/firmware.bin
            build/firmware.hex
            build/firmware.map

  test:
    name: Unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: make test

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: make cppcheck

  release:
    name: Publish release
    needs: [build, test, static-analysis]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only; creating a release needs write
    # access to repository contents. Granted here only, not repo-wide.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Build release binary
        run: make FW_VERSION=${GITHUB_REF_NAME#v}
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/firmware.bin
            build/firmware.hex
          generate_release_notes: true
